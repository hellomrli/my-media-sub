services:
  my-media-sub:
    image: ghcr.io/hellomrli/my-media-sub:latest
    # 如需本地源码构建，取消下面两行注释并注释 image。
    # build:
    #   context: .
    container_name: my-media-sub
    restart: unless-stopped
    # 优雅停机需要 HTTP 排空(15s) + 任务落盘宽限(30s) 的串联预算；
    # Docker 默认 10 秒会先发 SIGKILL，运行中任务只能靠重启恢复兜底。
    stop_grace_period: 60s
    # 日志只写 stdout，json-file 驱动默认无上限；长期运行必须设轮转。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # 默认只绑本机：管理面不应直接暴露到公网，对外请走反向代理
      # （见 docs/https-reverse-proxy.md）。需要局域网直连时改成 "56001:56001"。
      # 若保持本机绑定却仍从外部访问不到，请检查是否被上面的反代覆盖。
      - "${BIND_ADDRESS:-127.0.0.1}:56001:56001"
    # 容器加固：入口脚本需要 root 才能修正挂载属主并 gosu 降权到 UID 1000，
    # 因此这里保留它实际需要的 4 个 capability，其余全部丢弃
    # （去掉 NET_RAW、SYS_ADMIN、NET_ADMIN 等本服务完全用不到的能力）。
    # 注意不要直接 cap_drop: ALL —— 那会让 chown 与 gosu 的 setuid/setgid 失败。
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      # 禁止通过 setuid 二进制提权；gosu 是降权（不需要新权限），不受影响。
      - no-new-privileges:true
    # 根文件系统只读：可写的只有两个卷与下面挂的 tmpfs，
    # 入口脚本的 .tmp 标记文件写在运行时卷内，不在根文件系统上。
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # 数据持久化
      - ./data:/app/data
      # 可在线更新的二进制与 WebUI；与业务数据分开，容器重建后仍保留。
      - ./runtime:/app/runtime
    environment:
      # 基础服务配置
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=56001
      - SERVER_USERNAME=${SERVER_USERNAME:-admin}
      # 凭据从 .env 读取（参见 .env.example），不要写死在 compose 文件里。
      - SERVER_PASSWORD=${SERVER_PASSWORD:?set SERVER_PASSWORD in .env}
      - TZ=${TZ:-Asia/Shanghai}

      # 数据目录
      - DATA_DIR=/app/data
      # 默认启用 Docker 持久化运行目录在线更新；设为 false 可禁用更新 API。
      - SELF_UPDATE_ENABLED=${SELF_UPDATE_ENABLED:-true}
      - SELF_UPDATE_BACKUP_RETENTION=${SELF_UPDATE_BACKUP_RETENTION:-3}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:56001/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - media-sub-network

networks:
  media-sub-network:
    driver: bridge
