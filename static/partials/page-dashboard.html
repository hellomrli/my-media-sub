        <!-- 工作台：卡片化仪表盘，卡片顺序与可见性由 settings.dashboard_widgets 决定 -->
        <div x-show="currentTab === 'dashboard'" class="dashboard-page" :class="dashboardEditing ? 'is-editing' : ''">

          <div x-show="dashboardEditing" class="dashboard-editbar app-panel">
            <div class="dashboard-editbar-copy">
              <strong>编辑工作台</strong>
              <span>用 ↑ ↓ 调整顺序，✕ 隐藏卡片；下方是已隐藏的卡片。</span>
            </div>
            <div class="dashboard-editbar-tray">
              <template x-for="card in dashboardHiddenCards()" :key="'hidden-' + card.id">
                <button @click="toggleDashboardCard(card.id)" class="dashboard-chip" :title="card.hint">＋ <span x-text="card.name"></span></button>
              </template>
              <span x-show="dashboardHiddenCards().length === 0" class="dashboard-editbar-empty">所有卡片都已显示</span>
            </div>
            <div class="dashboard-editbar-actions">
              <button @click="resetDashboardLayout()" class="btn-secondary">恢复默认</button>
              <button @click="cancelDashboardEdit()" class="btn-secondary">取消</button>
              <button @click="saveDashboardLayout()" class="btn-primary">保存布局</button>
            </div>
          </div>

          <div class="dashboard-zone dashboard-zone-compact">
            <template x-for="card in dashboardCards('compact')" :key="'compact-' + card.id">
              <section class="dash-card" :class="'span-' + card.span" :data-card="card.id">
                <div x-show="dashboardEditing" class="dash-card-edit">
                  <span x-text="card.name"></span>
                  <span class="dash-card-edit-actions">
                    <button @click="moveDashboardCard(card.id, -1)" title="上移">↑</button>
                    <button @click="moveDashboardCard(card.id, 1)" title="下移">↓</button>
                    <button @click="toggleDashboardCard(card.id)" title="隐藏">✕</button>
                  </span>
                </div>

                <template x-if="card.id === 'command'">
                  <div class="dash-command">
                    <div class="dash-command-copy">
                      <div class="hero-kicker"><span class="status-pulse"></span><span x-text="dashboardDateLabel()"></span></div>
                      <p x-text="dashboardStatusSummary()"></p>
                    </div>
                    <div class="dash-command-actions">
                      <button @click="checkAllSubscriptions()" :disabled="checkingAllSubscriptions" class="btn-primary">
                        <svg class="w-4 h-4" :class="checkingAllSubscriptions ? 'animate-spin' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h5m11 11v-5h-5M5.1 9A8 8 0 0119 6.3M18.9 15A8 8 0 015 17.7"/></svg>
                        <span x-text="checkingAllSubscriptions ? '检查中' : '检查全部订阅'"></span>
                      </button>
                      <button @click="selectTab('search')" class="btn-secondary">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-5-5m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        搜索资源
                      </button>
                    </div>
                  </div>
                </template>

              </section>
            </template>
          </div>

          <div class="dashboard-zone dashboard-zone-panels">
            <template x-for="card in dashboardCards('panel')" :key="'panel-' + card.id">
              <section class="dash-card is-panel" :class="'span-' + card.span" :data-card="card.id">
                <div x-show="dashboardEditing" class="dash-card-edit">
                  <span x-text="card.name"></span>
                  <span class="dash-card-edit-actions">
                    <button @click="moveDashboardCard(card.id, -1)" title="上移">↑</button>
                    <button @click="moveDashboardCard(card.id, 1)" title="下移">↓</button>
                    <button @click="toggleDashboardCard(card.id)" title="隐藏">✕</button>
                  </span>
                </div>

                <template x-if="card.id === 'calendar'">
                  <div class="dash-panel-body is-flush">
              <section class="calendar-toolbar is-compact">
                <div class="calendar-toolbar-main">
                  <div class="calendar-range">
                    <h3 x-text="calendarRangeLabel()"></h3>
                  </div>
                  <div class="calendar-nav-actions">
                    <button @click="shiftCalendar(-1)" class="icon-button" aria-label="上一周期">←</button>
                    <button @click="resetCalendarToday()" class="btn-secondary">今天</button>
                    <button @click="shiftCalendar(1)" class="icon-button" aria-label="下一周期">→</button>
                  </div>
                  <div class="calendar-inline-metrics">
                    <span><strong x-text="calendarSummary.total"></strong>项</span>
                    <span class="is-primary">今日 <strong x-text="calendarSummary.by_status.today || 0"></strong></span>
                    <span class="is-warning">待处理 <strong x-text="(calendarSummary.by_status.aired_undiscovered || 0) + (calendarSummary.by_status.discovered_pending_transfer || 0) + (calendarSummary.by_status.transferred_pending_download || 0)"></strong></span>
                    <span class="is-danger">缺集 <strong x-text="calendarSummary.by_status.completed_missing || 0"></strong></span>
                  </div>
                </div>
                <div class="calendar-toolbar-filters">
                  <div class="segmented-control calendar-view-switch">
                    <button @click="setCalendarView('week')" :class="calendarView === 'week' ? 'is-active' : ''">周</button>
                    <button @click="setCalendarView('month')" :class="calendarView === 'month' ? 'is-active' : ''">月</button>
                    <button @click="setCalendarView('list')" :class="calendarView === 'list' ? 'is-active' : ''">列表</button>
                  </div>
                  <select x-model="calendarStatusFilter" @change="loadCalendar()" class="app-select">
                    <template x-for="option in calendarStatusOptions" :key="option.id"><option :value="option.id" x-text="option.name"></option></template>
                  </select>
                  <select x-model="calendarMediaFilter" @change="loadCalendar()" class="app-select">
                    <option value="all">全部类型</option>
                    <option value="series">剧集</option>
                    <option value="anime">动画</option>
                    <option value="movie">电影</option>
                  </select>
                </div>
              </section>

              <div x-show="calendarLoading" class="calendar-state"><span class="loading-spinner"></span><strong>正在整理媒体排期</strong><small>合并元数据、转存与下载状态</small></div>
              <div x-show="!calendarLoading && calendarError" class="calendar-state is-error"><strong>日历加载失败</strong><small x-text="calendarError"></small><button @click="loadCalendar()" class="btn-secondary">重试</button></div>
              <div x-show="!calendarLoading && !calendarError && calendarItems.length === 0" class="calendar-state"><strong>当前范围没有日历项目</strong><small>可以切换日期范围、清除筛选，或为订阅补充元数据与手动排期。</small><button @click="calendarStatusFilter = 'all'; calendarMediaFilter = 'all'; loadCalendar()" class="btn-secondary">清除筛选</button></div>

              <section x-show="!calendarLoading && !calendarError && calendarItems.length > 0 && calendarView === 'week'" class="calendar-week-shell">
                <div class="calendar-week-grid">
                  <template x-for="day in calendarWeekDays" :key="day.key">
                    <div class="calendar-day-column" :class="day.isToday ? 'is-today' : ''">
                      <div class="calendar-day-head"><span x-text="calendarDateLabel(day.key, true)"></span><strong x-text="day.day"></strong><small x-text="day.items.length + ' 项'"></small></div>
                      <div class="calendar-day-items">
                        <template x-for="(item, itemIndex) in day.items" :key="'calendar-week-' + (item.id || 'missing') + '-' + itemIndex">
                          <article :class="calendarItemClass(item)" class="calendar-item is-row">
                            <button @click="openSubscriptionDetail(item.subscription_id)" class="calendar-item-title"><img x-show="item.thumbnail_url" :src="remoteImageUrl(item.thumbnail_url)" :alt="item.subscription_title + ' 缩略图'" loading="lazy" referrerpolicy="no-referrer" @error="handleRemoteImageError($event)" @load="handleRemoteImageLoad($event)" class="calendar-thumbnail is-week"><span><strong x-text="item.subscription_title"></strong><small x-show="item.scheduled_time" x-text="item.scheduled_time"></small></span><span class="calendar-item-episode" x-text="item.episode ? 'S' + item.season + ' · E' + item.episode : '上映 / 开播'"></span></button>
                          </article>
                        </template>
                        <div x-show="day.items.length === 0" class="calendar-day-empty">暂无排期</div>
                      </div>
                    </div>
                  </template>
                </div>
              </section>

              <section x-show="!calendarLoading && !calendarError && calendarItems.length > 0 && calendarView === 'month'" class="calendar-month-shell">
                <div class="calendar-weekday-row"><span>周日</span><span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span></div>
                <div class="calendar-month-grid">
                  <template x-for="day in calendarMonthCells" :key="day.key">
                    <div class="calendar-month-day" :class="{'is-outside': !day.inMonth, 'is-today': day.isToday}">
                      <div class="calendar-month-date"><strong x-text="day.day"></strong><small x-show="day.items.length" x-text="day.items.length"></small></div>
                      <div class="calendar-month-items">
                        <template x-for="(item, itemIndex) in day.items.slice(0, 3)" :key="'calendar-month-' + (item.id || 'missing') + '-' + itemIndex">
                          <button @click="openSubscriptionDetail(item.subscription_id)" :class="calendarItemClass(item)"><img x-show="item.thumbnail_url" :src="remoteImageUrl(item.thumbnail_url)" :alt="item.subscription_title + ' 缩略图'" loading="lazy" referrerpolicy="no-referrer" @error="handleRemoteImageError($event)" @load="handleRemoteImageLoad($event)" class="calendar-thumbnail is-month"><span x-text="item.scheduled_time || '全天'"></span><strong x-text="item.subscription_title"></strong><small x-text="item.episode ? 'E' + item.episode : '上映'"></small></button>
                        </template>
                        <button x-show="day.items.length > 3" @click="setCalendarView('list')" class="calendar-month-more" x-text="'还有 ' + (day.items.length - 3) + ' 项'"></button>
                      </div>
                    </div>
                  </template>
                </div>
              </section>

              <section x-show="!calendarLoading && !calendarError && calendarItems.length > 0 && calendarView === 'list'" class="calendar-list-shell">
                <template x-for="group in calendarListGroups" :key="group.key">
                  <div class="calendar-list-group app-panel" :class="group.key === 'unknown' ? 'is-unknown' : ''">
                    <div class="calendar-list-date"><span x-text="calendarDateLabel(group.key, true)"></span><strong x-text="group.items.length + ' 项'"></strong></div>
                    <div class="calendar-list-items">
                      <template x-for="(item, itemIndex) in group.items" :key="'calendar-list-' + (item.id || 'missing') + '-' + itemIndex">
                        <article :class="calendarItemClass(item)">
                          <div class="calendar-list-time"><strong x-text="item.scheduled_time || (item.scheduled_date ? '全天' : '—')"></strong><span x-text="calendarStatusLabel(item.primary_status)"></span></div>
                          <button @click="openSubscriptionDetail(item.subscription_id)" class="calendar-list-title"><img x-show="item.thumbnail_url" :src="remoteImageUrl(item.thumbnail_url)" :alt="item.subscription_title + ' 缩略图'" loading="lazy" referrerpolicy="no-referrer" @error="handleRemoteImageError($event)" @load="handleRemoteImageLoad($event)" class="calendar-thumbnail is-list"><span><strong x-text="item.subscription_title"></strong><small x-text="item.episode ? '第 ' + item.episode + ' 集' : (item.scheduled_date ? '上映 / 开播' : '等待补充排期')"></small></span></button>
                          <div class="calendar-list-source"><span x-text="calendarSourceLabel(item.schedule_source)"></span><small :class="'is-' + item.confidence" x-text="calendarConfidenceLabel(item.confidence)"></small></div>
                          <div class="calendar-list-actions"><button @click="openSubscriptionDetail(item.subscription_id)">详情</button><button x-show="item.actions.can_check" @click="runCalendarAction(item, false)">检查</button><button x-show="item.actions.can_repair" @click="runCalendarAction(item, true)" class="is-repair">检查并补集</button></div>
                        </article>
                      </template>
                    </div>
                  </div>
                </template>
              </section>
                  </div>
                </template>

              </section>
            </template>
          </div>

          <div x-show="dashboardLayout.length === 0" class="app-panel empty-state">所有卡片都已隐藏，点右上角「编辑工作台」重新添加。</div>
        </div>
