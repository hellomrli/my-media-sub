        <!-- 活动中心：统一承载后台任务与系统通知 -->
        <div x-show="currentTab === 'notifications'" class="page-stack">
          <div class="metric-grid">
            <div class="stat-tile p-4">
              <div class="text-xs text-muted/75">全部活动</div>
              <div class="mt-2 text-2xl font-semibold text-text" x-text="activityStats.total"></div>
            </div>
            <div class="stat-tile p-4">
              <div class="text-xs text-muted/75">运行中任务</div>
              <div class="mt-2 text-2xl font-semibold text-warning" x-text="activityStats.running"></div>
            </div>
            <div class="stat-tile p-4">
              <div class="text-xs text-muted/75">失败项</div>
              <div class="mt-2 text-2xl font-semibold text-danger" x-text="activityStats.failed"></div>
            </div>
            <div class="stat-tile p-4">
              <div class="text-xs text-muted/75">未读通知</div>
              <div class="mt-2 text-2xl font-semibold text-primary" x-text="activityStats.unread"></div>
            </div>
            <div class="stat-tile p-4">
              <div class="text-xs text-muted/75">后台任务</div>
              <div class="mt-2 text-2xl font-semibold text-primary" x-text="activityStats.jobs"></div>
            </div>
            <div class="stat-tile p-4">
              <div class="text-xs text-muted/75">系统通知</div>
              <div class="mt-2 text-2xl font-semibold text-secondary" x-text="activityStats.notifications"></div>
            </div>
          </div>

          <div x-show="lastCheckResult" class="app-panel p-4 space-y-4">
            <div class="flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
              <div>
                <h3 class="section-title">最近检查结果</h3>
                <p class="text-sm text-muted/75 mt-1" x-text="lastCheckResult ? lastCheckResult.summary : ''"></p>
              </div>
              <button @click="lastCheckResult = null" class="btn-secondary px-3 py-2 rounded text-sm">关闭</button>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-7 gap-3">
              <div class="stat-tile p-3"><div class="text-xs text-muted/75">扫描文件</div><div class="mt-1 text-xl font-semibold text-text" x-text="lastCheckMetric('scanned_count')"></div></div>
              <div class="stat-tile p-3"><div class="text-xs text-muted/75">新增</div><div class="mt-1 text-xl font-semibold text-success" x-text="lastCheckMetric('new_count')"></div></div>
              <div class="stat-tile p-3"><div class="text-xs text-muted/75">已知</div><div class="mt-1 text-xl font-semibold text-primary" x-text="lastCheckMetric('known_count')"></div></div>
              <div class="stat-tile p-3"><div class="text-xs text-muted/75">目录跳过</div><div class="mt-1 text-xl font-semibold text-text/80" x-text="lastCheckMetric('skipped_directory_count')"></div></div>
              <div class="stat-tile p-3"><div class="text-xs text-muted/75">跨季跳过</div><div class="mt-1 text-xl font-semibold text-secondary" x-text="lastCheckMetric('skipped_other_season_count')"></div></div>
              <div class="stat-tile p-3"><div class="text-xs text-muted/75">起始集跳过</div><div class="mt-1 text-xl font-semibold text-warning" x-text="lastCheckMetric('skipped_before_start_count')"></div></div>
              <div class="stat-tile p-3"><div class="text-xs text-muted/75">同集跳过</div><div class="mt-1 text-xl font-semibold text-secondary" x-text="lastCheckMetric('skipped_duplicate_episode_count')"></div></div>
            </div>
            <div x-show="checkDetailItems().length > 0" class="data-table">
              <div class="data-table-scroll">
                <div class="data-table-head grid-cols-[minmax(320px,1fr)_90px_90px_minmax(240px,0.8fr)] px-3">
                  <div>文件名</div><div>集数</div><div>结果</div><div>原因</div>
                </div>
                <template x-for="(item, itemIndex) in checkDetailItems()" :key="'check-detail-' + (item.file_key || item.name || 'missing') + '-' + itemIndex">
                  <div class="data-table-row grid-cols-[minmax(320px,1fr)_90px_90px_minmax(240px,0.8fr)] px-3">
                    <div class="min-w-0"><div class="truncate text-text/85" x-text="item.name"></div><div x-show="item.parent_path" class="truncate text-xs text-muted/75" x-text="item.parent_path"></div></div>
                    <div class="text-xs text-muted/80" x-text="item.episode ? '第 ' + item.episode + ' 集' : '-' "></div>
                    <div><span class="badge" :class="item.action === 'new' ? 'badge-success' : (item.action === 'skip' ? 'badge-warning' : 'badge-primary')" x-text="checkActionLabel(item.action)"></span></div>
                    <div class="truncate text-xs text-muted/80" x-text="item.reason || '-' "></div>
                  </div>
                </template>
              </div>
            </div>
          </div>

          <div class="app-panel list-surface">
            <div class="p-4 border-b border-border toolbar-panel">
              <div>
                <h3 class="section-title">活动中心</h3>
                <p class="text-sm text-muted/75 mt-1">后台任务和系统通知按时间合并展示；失败任务可直接重试，通知仍可单独标记已读。</p>
              </div>
              <div class="control-row">
                <button @click="markAllRead()" class="btn-secondary px-3 py-2 rounded-lg transition-colors text-sm">全部已读</button>
                <button @click="clearNotifications()" class="btn-danger px-3 py-2 rounded-lg transition-colors text-sm">清空通知</button>
                <button @click="loadActivity()" class="btn-secondary px-3 py-2 rounded-lg transition-colors text-sm">刷新</button>
              </div>
            </div>
            <div class="p-4 border-b border-border grid grid-cols-1 md:grid-cols-[minmax(0,1fr)_auto_auto] gap-3">
              <input type="search" x-model="activityQuery" placeholder="搜索任务、通知、错误或事件" class="w-full px-4 py-2 bg-app border border-border rounded-lg text-text" />
              <div class="flex gap-2 overflow-x-auto">
                <template x-for="filter in activityFilters" :key="filter.id">
                  <button @click="activityFilter = filter.id" :class="activityFilter === filter.id ? 'btn-primary' : 'btn-secondary'" class="px-3 py-2 rounded-lg text-sm transition-colors whitespace-nowrap">
                    <span x-text="filter.name"></span><span class="ml-1 text-xs opacity-70" x-text="activityFilterCount(filter.id)"></span>
                  </button>
                </template>
              </div>
              <button @click="resetActivityFilters()" class="btn-secondary px-3 py-2 rounded-lg text-sm">清空筛选</button>
            </div>
            <div class="data-table">
              <div class="data-table-scroll">
                <div class="data-table-head grid-cols-[96px_98px_130px_minmax(300px,1fr)_132px_170px] px-3">
                  <div>来源</div><div>状态</div><div>事件</div><div>内容</div><div>时间</div><div class="text-right">操作</div>
                </div>
                <template x-for="(item, itemIndex) in visibleActivityItems" :key="'activity-' + (item.id || 'missing') + '-' + itemIndex">
                  <div>
                    <div class="data-table-row grid-cols-[96px_98px_130px_minmax(300px,1fr)_132px_170px] px-3" :class="item.source === 'notification' && !item.read ? 'bg-primary/5' : ''">
                      <div><span class="badge" :class="item.source === 'job' ? 'badge-cyan' : 'badge-muted'" x-text="activitySourceLabel(item.source)"></span></div>
                      <div><span :class="activityLevelBadgeClass(item)" x-text="activityStatusLabel(item)"></span></div>
                      <div><span class="badge badge-muted" x-text="activityEventLabel(item)"></span></div>
                      <div class="min-w-0">
                        <div class="truncate text-sm font-medium text-text" x-text="item.title"></div>
                        <div class="truncate text-xs text-muted/75" x-text="item.message || activityTimeLabel(item)"></div>
                        <div x-show="item.source === 'job' && ((item.raw.attempt || 1) > 1 || item.raw.error_class)" class="truncate text-[10px] text-warning/80" x-text="'第 ' + (item.raw.attempt || 1) + ' 次 · ' + jobErrorClassLabel(item.raw.error_class)"></div>
                      </div>
                      <div class="text-xs text-muted/75" x-text="activityTimeLabel(item)"></div>
                      <div class="flex flex-wrap justify-end gap-1">
                        <button x-show="item.source === 'job'" @click="openActivityItem(item)" class="btn-secondary px-2 py-1 rounded text-xs transition-colors">详情</button>
                        <select x-show="item.source === 'job' && item.raw.status === 'queued'" :value="item.raw.priority || 'normal'" @change="setJobPriority(item.raw, $event.target.value)" class="app-select px-1 py-1 text-xs" aria-label="任务优先级">
                          <option value="high">高</option><option value="normal">普通</option><option value="low">低</option>
                        </select>
                        <button x-show="item.source === 'job' && canCancelJob(item.raw)" @click="cancelJob(item.raw)" class="btn-secondary px-2 py-1 rounded text-xs transition-colors">取消</button>
                        <button x-show="item.source === 'job' && canRetryJob(item.raw)" @click="retryJob(item.raw)" class="btn-primary px-2 py-1 rounded text-xs transition-colors">重试</button>
                        <button x-show="item.source === 'notification' && !item.read" @click="markRead(item.raw.id)" class="btn-primary px-2 py-1 rounded text-xs transition-colors">已读</button>
                      </div>
                    </div>
                    <div x-show="item.source === 'job' && item.raw.error" class="border-b border-border bg-danger/5 px-3 py-2 text-xs text-danger break-all" x-text="item.raw.error"></div>
                    <div x-show="item.source === 'notification' && notificationHasPush(item.raw)" class="border-b border-border bg-app/40 px-3 py-2 text-xs text-text/80">
                      <details><summary class="cursor-pointer text-muted hover:text-text">推送详情</summary>
                        <div class="mt-2 flex flex-wrap gap-2">
                          <template x-for="(channel, channelIndex) in notificationPushChannelStatuses(item.raw)" :key="'activity-push-' + (channel.channel || 'missing') + '-' + channelIndex">
                            <span class="inline-flex items-center gap-1.5 rounded border px-2 py-1" :class="channel.success ? 'border-success/30 bg-success/10 text-success/85' : 'border-danger/30 bg-danger/10 text-danger/85'"><span x-text="channel.success ? '✓' : '!'"></span><span x-text="channel.name"></span><span x-show="channel.attempts > 1" class="text-muted" x-text="'x' + channel.attempts"></span></span>
                          </template>
                        </div>
                        <div x-show="notificationPushErrors(item.raw).length > 0" class="mt-2 space-y-1 text-danger/85"><template x-for="(error, errorIndex) in notificationPushErrors(item.raw)" :key="'activity-push-error-' + error.channel + '-' + errorIndex"><div><span x-text="pushChannelName(error.channel)"></span>: <span x-text="error.error"></span></div></template></div>
                      </details>
                    </div>
                  </div>
                </template>
              </div>
              <div x-show="filteredActivityItems.length > visibleActivityItems.length" class="p-3 text-center"><button @click="activityVisibleLimit += 100" class="btn-secondary px-5 py-2">加载更多活动</button></div>
              <div x-show="visibleActivityItems.length === 0" class="empty-state">暂无匹配的活动</div>
            </div>
          </div>
        </div>
