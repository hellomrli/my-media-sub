name: Docker Image

on:
  # main 分支镜像只在 CI 全绿后发布；直接 push 触发会让红色构建直达 :latest。
  workflow_run:
    workflows: [CI]
    types: [completed]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # build-push-action 的 .dockerbuild 记录仅用于临时调试，会长期堆积为 Actions artifacts。
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    # CI 也会因 pull_request 运行；只放行 main 分支 push 且结论为 success 的 CI。
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      # workflow_run 场景下 GITHUB_SHA 是事件分发时 main 的最新提交，可能比通过 CI 的
      # 提交更新；统一用通过了 CI 的 head_sha 检出与打标，避免发布未经测试的提交。
      - name: Resolve build commit
        id: commit
        shell: bash
        env:
          HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          SHA="${HEAD_SHA:-$GITHUB_SHA}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.commit.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=sha-${{ steps.commit.outputs.short }}
            type=raw,value=main,enable=${{ github.event_name == 'workflow_run' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test Docker data and runtime volume upgrade
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          CURRENT_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.commit.outputs.short }}"
          scripts/smoke-docker-upgrade.sh \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:1.3.0" \
            "$CURRENT_IMAGE"

      - name: Show published tags
        run: echo "${{ steps.meta.outputs.tags }}"
