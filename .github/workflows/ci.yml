name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check frontend JavaScript
        run: |
          node scripts/build-frontend.mjs --check
          find static -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          node --test tests/frontend_*.test.js

      - name: Lint frontend JavaScript
        # no-undef 拦截模块作用域裸标识符（v2.2.14 浏览器 Push 失效的根因）。
        run: npx --yes eslint@10.8.0 'static/**/*.js'

      - name: Check OpenAPI route and compatibility contract
        run: python3 scripts/check-openapi.py

      - name: Check documentation version consistency
        # release.yml 的同名检查只告警不阻断，漂移进了 main 要等下次发布才暴露；
        # 这里把四个版本面硬性对齐。README 的「版本说明」段与文档索引链接是历史上
        # 真正漂移过的地方（后者曾停留在 v2.5.1 连续三个发布未更新）。
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          echo "Cargo.toml version: $VERSION"
          grep -Fqx "### $VERSION" README.md \
            || { echo "❌ README.md 缺少 '### $VERSION' 版本说明段" >&2; exit 1; }
          grep -Fqx "## $VERSION" CHANGELOG.md \
            || { echo "❌ CHANGELOG.md 缺少 '## $VERSION' 段" >&2; exit 1; }
          test -s "docs/upgrade-v$VERSION.md" \
            || { echo "❌ docs/upgrade-v$VERSION.md 缺失或为空" >&2; exit 1; }
          grep -Fq -- "- 当前版本：[v$VERSION 升级指南](docs/upgrade-v$VERSION.md)" README.md \
            || { echo "❌ README.md 文档索引的「当前版本」链接未指向 v$VERSION" >&2; exit 1; }
          echo "✅ 版本说明段 / CHANGELOG / upgrade 文档 / 文档索引链接均与 $VERSION 一致"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check compilation
        run: cargo check --all-targets --all-features --locked

      - name: Run clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all --locked

      - name: Optional real Telegram sandbox smoke
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_SMOKE_SEND: "false"
        run: scripts/smoke-telegram.sh

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2023-0071

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke test release binary
        run: scripts/smoke-release.sh target/release/my-media-sub

      - name: Smoke test Docker entrypoint runtime initialization
        run: scripts/smoke-docker-entrypoint.sh target/release/my-media-sub static

      - name: Short stability soak
        env:
          SOAK_SECONDS: 10
        run: scripts/smoke-soak.sh target/release/my-media-sub

      - name: Install Chromium for browser smoke
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chromium-browser || sudo apt-get install -y --no-install-recommends chromium
          command -v chromium-browser || command -v chromium || command -v google-chrome || command -v google-chrome-stable

      - name: Real browser 390px and PWA shell smoke
        run: scripts/smoke-browser.sh target/release/my-media-sub

      - name: Download v1.3.0 upgrade baseline
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLO https://github.com/hellomrli/my-media-sub/releases/download/v1.3.0/my-media-sub-v1.3.0-linux-x86_64.tar.gz
          curl -fsSLO https://github.com/hellomrli/my-media-sub/releases/download/v1.3.0/my-media-sub-v1.3.0-linux-x86_64.tar.gz.sha256
          sha256sum -c my-media-sub-v1.3.0-linux-x86_64.tar.gz.sha256
          tar -xzf my-media-sub-v1.3.0-linux-x86_64.tar.gz

      - name: Smoke test v1.3.0 binary data upgrade
        run: |
          scripts/smoke-upgrade.sh \
            my-media-sub-v1.3.0-linux-x86_64/my-media-sub \
            my-media-sub-v1.3.0-linux-x86_64/static \
            target/release/my-media-sub static
