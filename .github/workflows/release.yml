name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v1.3.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x86_64:
    name: Build Linux x86_64 release
    # Keep the release binary compatible with the Debian bookworm runtime used by
    # the Docker image. ubuntu-latest can produce binaries requiring newer glibc.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify release tag matches Cargo version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          case "$TAG" in
            v*) ;;
            *) echo "Release tag must start with v: $TAG" >&2; exit 1 ;;
          esac
          CARGO_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "${TAG#v}" != "$CARGO_VERSION" ]; then
            echo "❌ Tag $TAG does not match Cargo version $CARGO_VERSION" >&2
            exit 1
          fi
          echo "✅ Tag matches Cargo.toml version: $CARGO_VERSION"

          # Documentation checks are warnings only - don't block release
          if ! grep -Fqx "### $CARGO_VERSION" README.md; then
            echo "⚠️  Warning: README.md is missing release heading: ### $CARGO_VERSION"
          else
            echo "✅ README.md has release heading"
          fi

          if [ ! -s CHANGELOG.md ]; then
            echo "⚠️  Warning: CHANGELOG.md is missing or empty"
          elif ! grep -Fqx "## $CARGO_VERSION" CHANGELOG.md; then
            echo "⚠️  Warning: CHANGELOG.md is missing version heading: ## $CARGO_VERSION"
          else
            echo "✅ CHANGELOG.md has version heading"
          fi

          if [ ! -s "docs/upgrade-v${CARGO_VERSION}.md" ]; then
            echo "⚠️  Warning: docs/upgrade-v${CARGO_VERSION}.md is missing or empty"
          else
            echo "✅ Upgrade documentation exists"
          fi

      - name: Check frontend JavaScript
        run: |
          node scripts/build-frontend.mjs --check
          find static -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          node --test tests/frontend_*.test.js

      - name: Lint frontend JavaScript
        run: npx --yes eslint@10.8.0 'static/**/*.js'

      - name: Check OpenAPI route and compatibility contract
        run: python3 scripts/check-openapi.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check compilation
        run: cargo check --all-targets --all-features --locked

      - name: Run clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke test release binary
        run: scripts/smoke-release.sh target/release/my-media-sub

      - name: Smoke test Docker entrypoint runtime initialization
        run: scripts/smoke-docker-entrypoint.sh target/release/my-media-sub static

      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          fi
          DIST="my-media-sub-${VERSION}-linux-x86_64"
          mkdir -p "dist/${DIST}"
          cp target/release/my-media-sub "dist/${DIST}/"
          cp -r static "dist/${DIST}/static"
          cp -r docs "dist/${DIST}/docs"
          cp README.md "dist/${DIST}/"
          cp CHANGELOG.md "dist/${DIST}/"
          tar -C dist -czf "${DIST}.tar.gz" "${DIST}"
          sha256sum "${DIST}.tar.gz" > "${DIST}.tar.gz.sha256"
          echo "archive=${DIST}.tar.gz" >> "$GITHUB_ENV"
          echo "checksum=${DIST}.tar.gz.sha256" >> "$GITHUB_ENV"

      - name: Sign release archive with minisign
        # SHA-256 只能证明「下载没坏」，不能证明「出自发布方」——校验和与载荷来自
        # 同一个 Release，因此能改 Release 的攻击者可以同时替换两者。真实的自动
        # 更新必须依赖编译进二进制的公钥（SELF_UPDATE_PUBLIC_KEY）。
        #
        # 一次性配置：
        #   minisign -G -p minisign.pub -s minisign.key     # 生成密钥对（CI 用无密码密钥）
        #   gh secret set MINISIGN_SECRET_KEY < minisign.key
        #   把 minisign.pub 里那行 base64 设为 CI 变量 SELF_UPDATE_PUBLIC_KEY，
        #   并在构建时通过 option_env! 固化进二进制（见 docs/docker-online-update.md）
        #
        # 未配置 Secret 时本步骤跳过并告警：签名是可选的，但**一旦**发布端签名且
        # 客户端配置了公钥，签名就是强制的（缺签名会拒绝安装）。
        #
        # 条件直接读 secrets 上下文：step 级 `if` 允许引用 secrets，而 step 自身
        # 声明的 env 在求值 `if` 时**尚不可用**（那会让本步骤永远被跳过）。
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        if: ${{ secrets.MINISIGN_SECRET_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v minisign >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
          fi
          KEY_FILE="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          # CI 使用**无密码**密钥（-W）；密钥本身只存在 GitHub Secrets 里，
          # 再加一层密码对 CI 场景收益很小，却会让这一步依赖交互式输入。
          minisign -S -s "$KEY_FILE" -m "${{ env.archive }}" -W
          rm -f "$KEY_FILE"
          test -s "${{ env.archive }}.minisig" || { echo "签名文件未生成" >&2; exit 1; }
          echo "signature=${{ env.archive }}.minisig" >> "$GITHUB_ENV"
          echo "✅ 已生成 minisign 签名 ${{ env.archive }}.minisig"

      - name: Warn when release is unsigned
        if: ${{ secrets.MINISIGN_SECRET_KEY == '' }}
        run: |
          echo "::warning::未配置 MINISIGN_SECRET_KEY，本次 Release 没有 .minisig 签名文件。客户端若设置了 SELF_UPDATE_PUBLIC_KEY 将拒绝安装本版本；配置方式见本文件注释与 docs/docker-online-update.md。"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          fi
          VERSION="${VERSION#v}"
          awk -v version="$VERSION" '
            $0 == "### " version { capture = 1; next }
            capture && /^### / { exit }
            capture { print }
          ' README.md | sed '/^[[:space:]]*$/d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "README.md 中没有找到版本 ${VERSION} 的更新内容" >&2
            exit 1
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-notes.md
          make_latest: true
          files: |
            ${{ env.archive }}
            ${{ env.checksum }}
            ${{ env.signature }}
